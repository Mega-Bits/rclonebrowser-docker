name: Build and publish GHCR image

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image_version="$(tr -d '[:space:]' < VERSION)"
          rclone_tag="$(gh api repos/rclone/rclone/releases/latest --jq .tag_name)"
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_version=${image_version}" >> "$GITHUB_OUTPUT"
          echo "rclone_version=${rclone_tag#v}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.versions.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.image_version }}
            type=raw,value=${{ steps.versions.outputs.image_version }}-rclone-${{ steps.versions.outputs.rclone_version }}
            type=raw,value=rclone-${{ steps.versions.outputs.rclone_version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ steps.versions.outputs.image_version }}
            org.opencontainers.image.description=RcloneBrowser with current rclone and restored transfer statistics

      - name: Build amd64 test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          pull: true
          platforms: linux/amd64
          build-args: |
            IMAGE_VERSION=${{ steps.versions.outputs.image_version }}
            RCLONE_VERSION=${{ steps.versions.outputs.rclone_version }}
            BUILD_DATE=${{ steps.versions.outputs.build_date }}
          tags: rclonebrowser:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test binaries and local data integrity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh rclonebrowser:ci-test -ec '
            test -x /usr/bin/rclone-browser
            test -x /usr/bin/rclone
            test -x /startapp.sh
            test -x /healthcheck.sh
            /usr/bin/rclone version
          '
          docker run --rm \
            --entrypoint /bin/sh \
            -v "$PWD/tests:/tests:ro" \
            rclonebrowser:ci-test \
            -ec '/bin/sh /tests/data-integrity.sh'

      - name: Smoke-test container health
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d \
            --security-opt no-new-privileges:true \
            --health-interval=2s \
            --health-timeout=5s \
            --health-start-period=5s \
            --health-retries=5 \
            -e USER_ID=1000 \
            -e GROUP_ID=1000 \
            rclonebrowser:ci-test)"
          cleanup() {
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          health="starting"
          for _ in $(seq 1 45); do
            running="$(docker inspect -f '{{.State.Running}}' "$cid")"
            if [ "$running" != "true" ]; then
              echo "Container stopped before becoming healthy" >&2
              exit 1
            fi

            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$cid")"
            case "$health" in
              healthy)
                break
                ;;
              starting)
                ;;
              unhealthy)
                echo "Container healthcheck reported unhealthy" >&2
                docker inspect -f '{{range .State.Health.Log}}{{println .Output}}{{end}}' "$cid" >&2 || true
                exit 1
                ;;
              *)
                echo "Docker healthcheck is missing or returned unexpected status: $health" >&2
                exit 1
                ;;
            esac
            sleep 1
          done

          [ "$health" = "healthy" ] || {
            echo "Container did not become healthy in time" >&2
            docker inspect -f '{{range .State.Health.Log}}{{println .Output}}{{end}}' "$cid" >&2 || true
            exit 1
          }

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            IMAGE_VERSION=${{ steps.versions.outputs.image_version }}
            RCLONE_VERSION=${{ steps.versions.outputs.rclone_version }}
            BUILD_DATE=${{ steps.versions.outputs.build_date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
