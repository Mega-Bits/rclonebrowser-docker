services:
  rclonebrowser:
    image: ghcr.io/mega-bits/rclonebrowser-docker:latest
    container_name: rclonebrowser
    restart: unless-stopped
    ports:
      - "5800:5800"
      - "5900:5900"
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: Europe/Amsterdam
      DISPLAY_WIDTH: "1600"
      DISPLAY_HEIGHT: "900"
    volumes:
      - ./config:/config
      - ./media:/media
